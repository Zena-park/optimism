<!-- L2 Monitor Tab -->
<div class="tab-panel" id="l2-monitor">
    <div class="panel-header">
        <h1>L2 Monitor</h1>
        <div class="header-controls">
            <button class="btn btn-secondary" onclick="refreshL2Data()">
                <span class="btn-icon">🔄</span> Refresh
            </button>
        </div>
    </div>

    <div class="monitor-sections">
        <!-- Network Status -->
        <div class="card">
            <div class="card-header">
                <h3>Network Status</h3>
            </div>
            <div class="card-content">
                <div class="stat-grid">
                    <div class="stat-item">
                        <span class="stat-label">L1 Block Height:</span>
                        <span class="stat-value" id="l1BlockHeight">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">L2 Block Height:</span>
                        <span class="stat-value" id="l2BlockHeight">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">State Root:</span>
                        <span class="stat-value small" id="stateRoot">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Sync Status:</span>
                        <span class="stat-value" id="syncStatus">Unknown</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dispute Games -->
        <div class="card">
            <div class="card-header">
                <h3>Dispute Games</h3>
                <div class="header-badge" id="disputeGameCount">0</div>
            </div>
            <div class="card-content">
                <div class="table-container">
                    <table class="data-table" id="disputeGamesTable">
                        <thead>
                            <tr>
                                <th>Game ID</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Participants</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="empty-row">
                                <td colspan="5">No dispute games found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
