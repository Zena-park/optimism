<!-- P2P Challengers Tab -->
<div class="tab-panel" id="p2p-challengers">
    <div class="panel-header">
        <h1>P2P Challengers</h1>
        <div class="header-controls">
            <button class="btn btn-secondary" onclick="refreshP2PData()">
                <span class="btn-icon">🔄</span> Refresh
            </button>
        </div>
    </div>

    <div class="p2p-sections">
        <!-- Peer Overview -->
        <div class="card">
            <div class="card-header">
                <h3>Peer Network</h3>
                <div class="header-badge" id="totalPeers">0</div>
            </div>
            <div class="card-content">
                <div class="peer-stats">
                    <div class="stat-item">
                        <span class="stat-label">Active Challengers:</span>
                        <span class="stat-value" id="activeChallengers">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Monitor Only:</span>
                        <span class="stat-value" id="monitorOnlyPeers">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Peer List -->
        <div class="card">
            <div class="card-header">
                <h3>Connected Peers</h3>
            </div>
            <div class="card-content">
                <div class="table-container">
                    <table class="data-table" id="peersTable">
                        <thead>
                            <tr>
                                <th>Peer ID</th>
                                <th>Mode</th>
                                <th>Connected</th>
                                <th>Version</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="empty-row">
                                <td colspan="5">No peers connected</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
