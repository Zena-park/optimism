<!-- History Tab -->
<div class="tab-panel" id="history">
    <div class="panel-header">
        <h1>Challenge History</h1>
        <div class="header-controls">
            <select class="filter-select" id="historyFilter">
                <option value="all">All Events</option>
                <option value="challenges">Challenges Only</option>
                <option value="disputes">Disputes Only</option>
            </select>
            <button class="btn btn-secondary" onclick="exportHistory()">
                <span class="btn-icon">📤</span> Export
            </button>
        </div>
    </div>

    <div class="history-sections">
        <!-- Statistics -->
        <div class="card">
            <div class="card-header">
                <h3>Statistics</h3>
            </div>
            <div class="card-content">
                <div class="stat-grid">
                    <div class="stat-item">
                        <span class="stat-label">Total Challenges:</span>
                        <span class="stat-value" id="totalChallenges">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Successful:</span>
                        <span class="stat-value success" id="successfulChallenges">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Failed:</span>
                        <span class="stat-value error" id="failedChallenges">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Pending:</span>
                        <span class="stat-value warning" id="pendingChallenges">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Event History -->
        <div class="card">
            <div class="card-header">
                <h3>Event History</h3>
            </div>
            <div class="card-content">
                <div class="table-container">
                    <table class="data-table" id="historyTable">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Event Type</th>
                                <th>Status</th>
                                <th>Details</th>
                                <th>Gas Used</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="empty-row">
                                <td colspan="5">No history available</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
