<!-- Settings Tab -->
<div class="tab-panel" id="settings">
    <div class="panel-header">
        <h1>Settings</h1>
        <div class="header-controls">
            <button class="btn btn-primary" onclick="saveSettings()">
                <span class="btn-icon">💾</span> Save
            </button>
            <button class="btn btn-secondary" onclick="resetSettings()">
                <span class="btn-icon">🔄</span> Reset
            </button>
        </div>
    </div>

    <!-- Network Configuration -->
    <div class="card">
        <div class="card-header">
            <h3>Network Configuration</h3>
        </div>
        <div class="card-content">
            <div class="form-grid">
                <div class="form-group">
                    <label>Network</label>
                    <select id="network" onchange="updateNetworkDefaults()">
                        <option value="sepolia">Sepolia (Testnet)</option>
                        <option value="mainnet">Mainnet</option>
                        <option value="local">Local</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>L1 Ethereum RPC</label>
                    <input type="text" id="l1_eth_rpc" placeholder="https://ethereum-sepolia-rpc.publicnode.com">
                </div>
                <div class="form-group">
                    <label>L2 Optimism RPC</label>
                    <input type="text" id="l2_eth_rpc" placeholder="https://sepolia.optimism.io">
                </div>
                <div class="form-group">
                    <label>Rollup RPC</label>
                    <input type="text" id="rollup_rpc" placeholder="https://sepolia.optimism.io">
                </div>
            </div>
        </div>
    </div>

    <!-- Operation Mode -->
    <div class="card">
        <div class="card-header">
            <h3>Operation Mode</h3>
        </div>
        <div class="card-content">
            <div class="mode-selector">
                <div class="mode-option">
                    <input type="radio" id="monitor_mode" name="operation_mode" value="monitor" checked>
                    <label for="monitor_mode">
                        <div class="mode-title">🔍 Monitor Only (Safe)</div>
                        <div class="mode-description">Observe network activity without submitting challenges</div>
                    </label>
                </div>
                <div class="mode-option">
                    <input type="radio" id="challenger_mode" name="operation_mode" value="challenger">
                    <label for="challenger_mode">
                        <div class="mode-title">⚔️ Active Challenger</div>
                        <div class="mode-description warning">Automatically submit challenges (requires wallet setup)</div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- P2P Settings -->
    <div class="card">
        <div class="card-header">
            <h3>P2P Configuration</h3>
        </div>
        <div class="card-content">
            <div class="form-grid">
                <div class="form-group">
                    <div class="checkbox-row">
                        <input type="checkbox" id="p2p_enabled" checked>
                        <label for="p2p_enabled">Enable P2P Networking</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Listen Address</label>
                    <input type="text" id="p2p_listen_addr" value="/ip4/0.0.0.0/tcp/9876">
                </div>
                <div class="form-group">
                    <label>Max Peers</label>
                    <input type="number" id="p2p_max_peers" value="50" min="1" max="200">
                </div>
                <div class="form-group full-width">
                    <label>Boot Nodes</label>
                    <textarea id="p2p_bootnodes" rows="3" placeholder="Enter boot node addresses (one per line)"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div class="card">
        <div class="card-header">
            <h3>Notifications</h3>
        </div>
        <div class="card-content">
            <div class="form-grid">
                <div class="form-group">
                    <div class="checkbox-row">
                        <input type="checkbox" id="notifications_enabled">
                        <label for="notifications_enabled">Enable Notifications</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email_address" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Slack Webhook</label>
                    <input type="text" id="slack_webhook" placeholder="https://hooks.slack.com/...">
                </div>
            </div>
        </div>
    </div>
</div>
