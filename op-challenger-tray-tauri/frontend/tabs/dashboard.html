<!-- Dashboard Tab -->
<div class="tab-panel active" id="dashboard">
    <div class="panel-header">
        <h1>Dashboard</h1>
        <div class="header-controls">
            <button class="btn btn-primary" id="startBtn" onclick="startChallenger()">
                <span class="btn-icon">▶️</span> Start
            </button>
            <button class="btn btn-secondary" id="stopBtn" onclick="stopChallenger()">
                <span class="btn-icon">⏸️</span> Stop
            </button>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- 상태 카드 -->
        <div class="card status-card">
            <div class="card-header">
                <h3>System Status</h3>
                <div class="status-badge" id="systemStatus">Stopped</div>
            </div>
            <div class="card-content">
                <div class="stat-row">
                    <span class="stat-label">Mode:</span>
                    <span class="stat-value" id="operationMode">Monitor Only</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Network:</span>
                    <span class="stat-value" id="currentNetwork">Sepolia</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Uptime:</span>
                    <span class="stat-value" id="uptime">00:00:00</span>
                </div>
            </div>
        </div>

        <!-- P2P 상태 -->
        <div class="card">
            <div class="card-header">
                <h3>P2P Network</h3>
            </div>
            <div class="card-content">
                <div class="stat-row">
                    <span class="stat-label">Connected Peers:</span>
                    <span class="stat-value" id="peerCount">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Network ID:</span>
                    <span class="stat-value" id="networkId">-</span>
                </div>
            </div>
        </div>

        <!-- 최근 활동 -->
        <div class="card activity-card">
            <div class="card-header">
                <h3>Recent Activity</h3>
            </div>
            <div class="card-content">
                <div class="activity-list" id="recentActivity">
                    <div class="activity-item">
                        <span class="activity-time">--:--</span>
                        <span class="activity-text">No recent activity</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
